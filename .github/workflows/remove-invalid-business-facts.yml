name: Remove invalid business facts from audit workspaces

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-invalid-business-facts.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove invalid 30/70 and 250-euro claims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          targets = []
          targets += sorted((root / 'PROMPTS').glob('*.txt'))
          targets += sorted((root / 'IDIOMAS').glob('*/05_PROMPT_GITHUB_*.txt'))
          targets += sorted((root / 'IDIOMAS').glob('*/05_PROMPT_NUEVO_CHAT_*.txt'))
          targets += sorted((root / 'IDIOMAS').glob('*/01_CORRECCIONES_POR_PAGINA.md'))
          targets += sorted((root / 'IDIOMAS').glob('*/README.md'))
          targets += [
              root / 'README.md',
              root / 'AUDITORIA_COMPARTIDA' / 'DATOS_CANONICOS_PROPIETARIO.md',
              root / 'AUDITORIA_COMPARTIDA' / 'DECISIONES_OPERATIVAS.md',
          ]

          # Remove lines that assert the invalid reservation rule or treat 250 EUR as official policy.
          bad_patterns = [
              re.compile(r'30\s*%.*70\s*%', re.I),
              re.compile(r'30\s*/\s*70', re.I),
              re.compile(r'250\s*€', re.I),
              re.compile(r'€\s*250', re.I),
          ]

          review_rule_es = (
              '- Regla sobre reseñas: las experiencias narradas por clientes NO son políticas ni hechos empresariales oficiales. '
              'No convertir en contenido de la web anécdotas de reseñas sobre depósitos, importes, playa, toallas, bañador u otros detalles similares '
              'salvo que exista una fuente oficial independiente de RSB que lo confirme.'
          )
          invalid_rule_es = (
              '- El esquema de reserva 30 % + 70 % NO EXISTE y queda anulado. No usarlo, no corregir ninguna página hacia ese esquema y no tratarlo como dato oficial.'
          )
          deposit_rule_es = (
              '- La cifra de 250 € de depósito NO es una política oficial de RSB: procede de una reseña de cliente. No usarla como dato canónico ni insertarla en la web.'
          )

          prompt_review_rules = {
              'EN': '- Customer-review rule: customer anecdotes are NOT official RSB policies or business facts. Do not turn review details about deposits, amounts, beach visits, towels, swimwear, or similar anecdotes into website content unless an independent official RSB source confirms them.',
              'ES': review_rule_es,
              'FR': '- Règle sur les avis clients : les anecdotes racontées par des clients NE constituent PAS des politiques officielles ni des faits commerciaux de RSB. Ne transforme pas en contenu du site des détails d’avis sur des cautions, montants, plage, serviettes, maillot de bain ou faits similaires sans confirmation indépendante par une source officielle RSB.',
              'IT': '- Regola sulle recensioni: gli aneddoti dei clienti NON sono politiche ufficiali né fatti aziendali RSB. Non trasformare in contenuto del sito dettagli delle recensioni su depositi, importi, spiaggia, asciugamani, costume da bagno o fatti simili senza una conferma indipendente da una fonte ufficiale RSB.',
              'DE': '- Regel zu Kundenbewertungen: Erlebnisse aus Kundenbewertungen sind KEINE offiziellen RSB-Richtlinien oder Unternehmensfakten. Angaben aus Bewertungen zu Kautionen, Beträgen, Strandbesuchen, Handtüchern, Badebekleidung oder Ähnlichem dürfen nicht als Website-Inhalt übernommen werden, sofern sie nicht durch eine unabhängige offizielle RSB-Quelle bestätigt sind.',
              'NL': '- Regel voor reviews: ervaringen uit klantreviews zijn GEEN officieel RSB-beleid of bedrijfsfeiten. Zet details uit reviews over borg, bedragen, strandbezoek, handdoeken, badkleding of vergelijkbare anekdotes niet om in website-inhoud tenzij een onafhankelijke officiële RSB-bron dit bevestigt.',
              'PT': '- Regra sobre avaliações: relatos de clientes NÃO são políticas oficiais nem factos empresariais da RSB. Não transformar em conteúdo do site detalhes de avaliações sobre cauções, valores, praia, toalhas, fato de banho ou situações semelhantes sem confirmação independente de uma fonte oficial da RSB.',
              'CA': '- Regla sobre ressenyes: les experiències explicades pels clients NO són polítiques oficials ni fets empresarials de RSB. No converteixis en contingut web detalls de ressenyes sobre dipòsits, imports, platja, tovalloles, banyador o situacions semblants sense una confirmació independent d’una font oficial de RSB.',
              'SV': '- Regel för kundrecensioner: kunders berättelser är INTE officiella RSB-policyer eller företagsfakta. Gör inte om uppgifter i recensioner om depositioner, belopp, strandbesök, handdukar, badkläder eller liknande till webbplatsinnehåll om de inte bekräftas av en oberoende officiell RSB-källa.',
              'PL': '- Zasada dotycząca opinii klientów: opisy doświadczeń klientów NIE są oficjalnymi zasadami ani faktami biznesowymi RSB. Nie zamieniaj informacji z opinii o kaucjach, kwotach, plaży, ręcznikach, stroju kąpielowym lub podobnych anegdotach w treść strony bez niezależnego potwierdzenia w oficjalnym źródle RSB.',
          }

          prompt_invalid_rules = {
              'EN': '- The 30% + 70% booking scheme DOES NOT EXIST and is cancelled. Do not use it, do not correct any page toward it, and do not treat it as an official fact. The €250 scooter-deposit figure is from a customer review and is NOT an official RSB policy; do not use it as canonical data or insert it into the website.',
              'ES': invalid_rule_es + '\n' + deposit_rule_es,
              'FR': '- Le schéma de réservation 30 % + 70 % N’EXISTE PAS et est annulé. Ne l’utilise pas, ne corrige aucune page vers ce schéma et ne le traite pas comme un fait officiel. Le montant de 250 € de caution provient d’un avis client et N’EST PAS une politique officielle de RSB ; ne l’utilise pas comme donnée canonique et ne l’insère pas sur le site.',
              'IT': '- Lo schema di prenotazione 30% + 70% NON ESISTE ed è annullato. Non usarlo, non correggere alcuna pagina verso tale schema e non trattarlo come dato ufficiale. La cifra di 250 € per il deposito proviene da una recensione cliente e NON è una politica ufficiale RSB; non usarla come dato canonico né inserirla nel sito.',
              'DE': '- Das Buchungsschema 30 % + 70 % EXISTIERT NICHT und ist aufgehoben. Nicht verwenden, keine Seite daraufhin korrigieren und nicht als offizielle Angabe behandeln. Die Kautionsangabe von 250 € stammt aus einer Kundenbewertung und ist KEINE offizielle RSB-Richtlinie; nicht als kanonische Angabe verwenden oder in die Website einfügen.',
              'NL': '- Het boekingsschema 30% + 70% BESTAAT NIET en is ingetrokken. Gebruik het niet, corrigeer geen pagina naar dit schema en behandel het niet als officieel feit. Het borgbedrag van €250 komt uit een klantreview en is GEEN officieel RSB-beleid; gebruik het niet als canonieke informatie en voeg het niet aan de website toe.',
              'PT': '- O esquema de reserva 30% + 70% NÃO EXISTE e fica anulado. Não o uses, não corrijas nenhuma página para esse esquema e não o trates como facto oficial. O valor de 250 € de caução vem de uma avaliação de cliente e NÃO é uma política oficial da RSB; não o uses como dado canónico nem o insiras no site.',
              'CA': '- L’esquema de reserva 30 % + 70 % NO EXISTEIX i queda anul·lat. No l’utilitzis, no corregeixis cap pàgina cap a aquest esquema i no el tractis com un fet oficial. La xifra de 250 € de dipòsit prové d’una ressenya de client i NO és una política oficial de RSB; no l’utilitzis com a dada canònica ni la introdueixis al web.',
              'SV': '- Bokningsupplägget 30 % + 70 % FINNS INTE och är annullerat. Använd det inte, korrigera ingen sida mot det och behandla det inte som officiell information. Depositionen på 250 € kommer från en kundrecension och är INTE en officiell RSB-policy; använd den inte som kanonisk uppgift och lägg inte in den på webbplatsen.',
              'PL': '- Schemat rezerwacji 30% + 70% NIE ISTNIEJE i zostaje unieważniony. Nie używaj go, nie poprawiaj żadnej strony w tym kierunku i nie traktuj go jako oficjalnego faktu. Kwota kaucji 250 € pochodzi z opinii klienta i NIE jest oficjalną polityką RSB; nie używaj jej jako danych kanonicznych ani nie dodawaj jej do strony.',
          }

          changed = []
          for path in targets:
              if not path.exists() or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              new_lines = []
              for line in lines:
                  if any(p.search(line) for p in bad_patterns):
                      continue
                  new_lines.append(line)
              new = '\n'.join(new_lines).rstrip() + '\n'

              # Add explicit anti-review / invalid-fact safeguards to prompts.
              if path.parent.name == 'PROMPTS' or '05_PROMPT_' in path.name:
                  code = path.stem.split('_')[-1] if path.parent.name != 'PROMPTS' else path.stem
                  if code in prompt_review_rules:
                      marker = prompt_review_rules[code]
                      invalid = prompt_invalid_rules[code]
                      if marker not in new:
                          # Insert after the reviews line if possible, otherwise near correction instructions.
                          nlines = new.splitlines()
                          pos = next((i+1 for i,l in enumerate(nlines) if '226' in l), min(8, len(nlines)))
                          nlines[pos:pos] = [invalid, marker]
                          new = '\n'.join(nlines).rstrip() + '\n'

              # Shared/root docs: add clear Spanish correction note.
              if path.as_posix() in {
                  'README.md',
                  'AUDITORIA_COMPARTIDA/DATOS_CANONICOS_PROPIETARIO.md',
                  'AUDITORIA_COMPARTIDA/DECISIONES_OPERATIVAS.md',
              }:
                  note = invalid_rule_es + '\n' + deposit_rule_es + '\n' + review_rule_es
                  if invalid_rule_es not in new:
                      new = new.rstrip() + '\n\n## Rectificación expresa del propietario\n' + note + '\n'

              # Per-language correction plans: add a compact Spanish safeguard after owner decisions.
              if path.name == '01_CORRECCIONES_POR_PAGINA.md':
                  safeguard = (
                      '- RECTIFICACIÓN: el esquema 30 % + 70 % no existe y queda anulado; no usarlo como corrección.\n'
                      '- RECTIFICACIÓN: 250 € de depósito es un dato de una reseña de cliente, no una política oficial; no usarlo como dato canónico.\n'
                      '- No convertir anécdotas de reseñas (playa, toallas, bañador, importes, depósitos, etc.) en hechos o contenido oficial sin fuente RSB independiente.\n'
                  )
                  if 'RECTIFICACIÓN: el esquema 30 % + 70 % no existe' not in new:
                      nlines = new.splitlines()
                      pos = next((i for i,l in enumerate(nlines) if l.strip() == '## Reglas'), min(12, len(nlines)))
                      nlines[pos:pos] = safeguard.rstrip().splitlines() + ['']
                      new = '\n'.join(nlines).rstrip() + '\n'

              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.as_posix())

          print('Changed files:')
          for p in changed:
              print(p)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROMPTS IDIOMAS AUDITORIA_COMPARTIDA
          if git diff --cached --quiet; then
            echo "No content changes required."
            exit 0
          fi
          git commit -m "Remove invalid reservation and review-derived deposit claims"
          git push
